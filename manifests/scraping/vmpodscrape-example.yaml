# VMPodScrape - the VictoriaMetrics equivalent of PodMonitor.
#
# Schema is byte-for-byte compatible with PodMonitor's for the fields we
# actually use (selector, namespaceSelector, podMetricsEndpoints with
# port/path/relabelConfigs). The wire difference from PodMonitor: VM
# renames the field from `relabelings` to `relabelConfigs` and the
# apiVersion/kind change.
#
# This example scrapes any pod labelled `app=demo` on port named `metrics`
# at /metrics. Drop it in to see how the operator reconciles it into
# vmagent's scrape config.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: demo-app
  namespace: vm
spec:
  selector:
    matchLabels:
      app: demo
  namespaceSelector:
    any: true
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node_name
